name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudbrowser-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNTIME_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      RUNTIME_BROWSER_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_TOKEN }}

    steps:
      - name: Check deployment secrets
        id: config
        shell: bash
        run: |
          missing=()
          [[ -n "$CF_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CF_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$RUNTIME_ADMIN_TOKEN" ]] || missing+=("ADMIN_TOKEN")
          [[ -n "$RUNTIME_BROWSER_TOKEN" ]] || missing+=("CLOUDFLARE_BROWSER_TOKEN")

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Cloudflare deployment not started"
              echo
              echo "Add these repository Actions secrets, then run this workflow again:"
              printf -- "- \`%s\`\n" "${missing[@]}"
              echo
              echo "Secrets: https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Validate
        if: steps.config.outputs.ready == 'true'
        run: npm run typecheck && npm test

      - name: Deploy Worker
        if: steps.config.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ADMIN_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_BROWSER_TOKEN
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_TOKEN }}
